name: Distribute Organization Secrets

on:
  push:
    branches:
      - main
      - feat/workflow
    paths:
      - 'repos.txt'
      - 'distribute_org_secrets.py'
      - '.github/workflows/distribute-org-secrets.yml'
  workflow_dispatch:

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyGithub PyNaCl requests

      - name: Distribute secrets to repositories
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG_NAME: ${{ vars.ORG_NAME }}
          # Fetch secrets from organization secrets
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: python distribute_org_secrets.py
