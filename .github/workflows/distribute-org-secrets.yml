name: Distribute Organization Secrets

on:
  workflow_dispatch:

jobs:
  distribute-org-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyGithub PyNaCl

      - name: Distribute organization secrets
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          ORG_NAME: ${{ secrets.ORG_NAME }}  # Add your org name as a secret
        run: python distribute_org_secrets.py
