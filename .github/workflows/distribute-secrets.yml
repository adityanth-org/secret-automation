name: Distribute Secrets to Repositories

on:
  push:
    branches:
      - main
      - feat/workflow
    paths:
      - 'repos1.yaml'
      - '.github/workflows/distribute-secrets.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    env:
      ORG_NAME: adityanth-org
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq (YAML parser)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install jq (JSON parser)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Update organization secret repository access
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          echo "Updating organization secret repository access"
          echo "Organization: $ORG_NAME"
          echo "================================================"
          
          # Validate ORG_NAME is set
          if [ -z "$ORG_NAME" ]; then
            echo "✗ Error: ORG_NAME is not set."
            exit 1
          fi
          
          # Get the number of secrets defined in repos1.yaml
          SECRET_COUNT=$(yq '.secrets | length' repos1.yaml)
          echo "Found $SECRET_COUNT secret(s) to configure"
          echo ""
          
          # Counters for summary
          TOTAL_SECRETS=0
          SUCCESS_SECRETS=0
          SKIPPED_REPOS=0
          
          # Loop through each secret
          for i in $(seq 0 $((SECRET_COUNT - 1))); do
            SECRET_NAME=$(yq ".secrets[$i].name" repos1.yaml)
            ORG_SECRET_NAME=$(yq ".secrets[$i].org_secret_name" repos1.yaml)
            
            echo "Processing secret: $SECRET_NAME"
            echo "  Organization secret: $ORG_SECRET_NAME"
            
            TOTAL_SECRETS=$((TOTAL_SECRETS + 1))
            
            # Get repositories for this secret
            REPO_COUNT=$(yq ".secrets[$i].repositories | length" repos1.yaml)
            
            # Build array of repository IDs (skip non-existent repos)
            REPO_IDS="["
            VALID_REPO_COUNT=0
            
            for j in $(seq 0 $((REPO_COUNT - 1))); do
              REPO_NAME=$(yq ".secrets[$i].repositories[$j]" repos1.yaml)
              
              # Get repository ID
              REPO_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$ORG_NAME/$REPO_NAME")
              
              REPO_ID=$(echo "$REPO_RESPONSE" | jq -r '.id')
              
              if [ "$REPO_ID" == "null" ] || [ -z "$REPO_ID" ]; then
                echo "  ⚠ Warning: Repository $ORG_NAME/$REPO_NAME does not exist - skipping"
                SKIPPED_REPOS=$((SKIPPED_REPOS + 1))
                continue
              fi
              
              # Add to list
              if [ $VALID_REPO_COUNT -eq 0 ]; then
                REPO_IDS="${REPO_IDS}${REPO_ID}"
              else
                REPO_IDS="${REPO_IDS},${REPO_ID}"
              fi
              
              VALID_REPO_COUNT=$((VALID_REPO_COUNT + 1))
            done
            REPO_IDS="${REPO_IDS}]"
            
            # Check if we have any valid repositories
            if [ $VALID_REPO_COUNT -eq 0 ]; then
              echo "  ⚠ Warning: No valid repositories found for $SECRET_NAME - skipping secret update"
              echo ""
              continue
            fi
            
            echo "  Valid repositories: $VALID_REPO_COUNT"
            echo "  Repository IDs: $REPO_IDS"
            
            # Update secret visibility using GitHub API
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/$ORG_NAME/actions/secrets/$ORG_SECRET_NAME/repositories" \
              -d "{\"selected_repository_ids\": $REPO_IDS}")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            
            if [ "$HTTP_CODE" == "204" ]; then
              echo "  ✓ Updated repository access for $SECRET_NAME"
              SUCCESS_SECRETS=$((SUCCESS_SECRETS + 1))
            else
              echo "  ✗ Failed to update $SECRET_NAME (HTTP $HTTP_CODE)"
              RESPONSE_BODY=$(echo "$RESPONSE" | head -n-1)
              echo "  Response: $RESPONSE_BODY"
            fi
            
            echo ""
          done
          
          echo "================================================"
          echo "Summary:"
          echo "  Total secrets processed: $TOTAL_SECRETS"
          echo "  Successfully updated: $SUCCESS_SECRETS"
          echo "  Repositories skipped (not found): $SKIPPED_REPOS"
          echo "================================================"
          
          if [ $SUCCESS_SECRETS -eq $TOTAL_SECRETS ]; then
            echo "✓ All organization secret access updated successfully!"
          elif [ $SUCCESS_SECRETS -gt 0 ]; then
            echo "⚠ Partially completed - some secrets were updated"
          else
            echo "✗ No secrets were updated"
            exit 1
          fi
          
          echo ""
          echo "Note: This workflow updates repository access for EXISTING organization secrets."
          echo "Make sure the secrets are already created in your organization with 'selected' visibility."
