name: Distribute Secrets to Repositories

on:
  push:
    branches:
      - main
      - feat/workflow
    paths:
      - 'repos1.yaml'
      - '.github/workflows/distribute-secrets.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    env:
      ORG_NAME: adityanth-org
      # Add all secrets that are referenced in repos1.yaml
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq (YAML parser)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Add organization secrets with selected repository access
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          echo "Adding organization secrets with access to selected repositories"
          echo "Organization: $ORG_NAME"
          echo "================================================"
          
          # Validate ORG_NAME is set
          if [ -z "$ORG_NAME" ]; then
            echo "✗ Error: ORG_NAME is not set. Please set it as an organization variable."
            exit 1
          fi
          
          # Get the number of secrets defined in repos1.yaml
          SECRET_COUNT=$(yq '.secrets | length' repos1.yaml)
          echo "Found $SECRET_COUNT secret(s) to distribute"
          echo ""
          
          # Loop through each secret
          for i in $(seq 0 $((SECRET_COUNT - 1))); do
            SECRET_NAME=$(yq ".secrets[$i].name" repos1.yaml)
            ORG_SECRET_NAME=$(yq ".secrets[$i].org_secret_name" repos1.yaml)
            
            echo "Processing secret: $SECRET_NAME"
            echo "  Fetching from org secret: $ORG_SECRET_NAME"
            
            # Get the secret value from environment (must be passed from org secrets)
            SECRET_VALUE="${!ORG_SECRET_NAME}"
            
            if [ -z "$SECRET_VALUE" ]; then
              echo "  ✗ Error: $ORG_SECRET_NAME is not set in environment"
              echo "  Make sure to add it to the workflow env section"
              exit 1
            fi
            
            # Get repositories for this secret
            REPO_COUNT=$(yq ".secrets[$i].repositories | length" repos1.yaml)
            REPO_LIST=""
            
            for j in $(seq 0 $((REPO_COUNT - 1))); do
              REPO_NAME=$(yq ".secrets[$i].repositories[$j]" repos1.yaml)
              
              if [ -z "$REPO_LIST" ]; then
                REPO_LIST="$REPO_NAME"
              else
                REPO_LIST="$REPO_LIST,$REPO_NAME"
              fi
            done
            
            echo "  Repositories: $REPO_LIST"
            
            # Add secret to organization with selected visibility
            if gh secret set "$SECRET_NAME" \
              --org "$ORG_NAME" \
              --visibility selected \
              --repos "$REPO_LIST" \
              --body "$SECRET_VALUE"; then
              echo "  ✓ $SECRET_NAME added to organization"
            else
              echo "  ✗ Failed to add $SECRET_NAME"
              exit 1
            fi
            
            echo ""
          done
          
          echo "================================================"
          echo "✓ All organization secrets distributed successfully!"
