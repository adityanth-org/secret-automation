name: Distribute Secrets to Repositories

on:
  push:
    branches:
      - main
      - feat/workflow
    paths:
      - 'repos.txt'
      - '.github/workflows/distribute-secrets.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    env:
      ORG_NAME: adityanth-org
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Add organization secrets with selected repository access
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          # Fetch secrets from organization secrets
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "Adding organization secrets with access to selected repositories"
          echo "Organization: $ORG_NAME"
          echo "================================================"
          
          # Validate ORG_NAME is set
          if [ -z "$ORG_NAME" ]; then
            echo "✗ Error: ORG_NAME is not set. Please set it as an organization variable."
            exit 1
          fi
          
          # Build comma-separated list of repository names (without org prefix)
          echo "Reading repositories from repos.txt..."
          REPO_LIST=""
          while IFS= read -r repo || [ -n "$repo" ]; do
            # Skip empty lines and comments
            [[ -z "$repo" || "$repo" =~ ^#.* ]] && continue
            
            # Extract just the repo name (remove org prefix)
            REPO_NAME=$(echo "$repo" | cut -d'/' -f2)
            
            if [ -z "$REPO_LIST" ]; then
              REPO_LIST="$REPO_NAME"
            else
              REPO_LIST="$REPO_LIST,$REPO_NAME"
            fi
          done < repos.txt
          
          echo "Repositories: $REPO_LIST"
          echo ""
          
          # Add DOCKERHUB_USERNAME as organization secret with selected visibility
          echo "Adding DOCKERHUB_USERNAME to organization..."
          if gh secret set DOCKERHUB_USERNAME \
            --org "$ORG_NAME" \
            --visibility selected \
            --repos "$REPO_LIST" \
            --body "$DOCKERHUB_USERNAME"; then
            echo "✓ DOCKERHUB_USERNAME added to organization"
          else
            echo "✗ Failed to add DOCKERHUB_USERNAME"
            exit 1
          fi
          
          # Add DOCKERHUB_PASSWORD as organization secret with selected visibility
          echo "Adding DOCKERHUB_PASSWORD to organization..."
          if gh secret set DOCKERHUB_PASSWORD \
            --org "$ORG_NAME" \
            --visibility selected \
            --repos "$REPO_LIST" \
            --body "$DOCKERHUB_PASSWORD"; then
            echo "✓ DOCKERHUB_PASSWORD added to organization"
          else
            echo "✗ Failed to add DOCKERHUB_PASSWORD"
            exit 1
          fi
          
          echo ""
          echo "================================================"
          echo "✓ Organization secrets added successfully!"
          echo "✓ Secrets are accessible to repositories listed in repos.txt"
