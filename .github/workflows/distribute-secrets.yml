name: Distribute Secrets to Repositories

on:
  push:
    branches:
      - main
      - 
    paths:
      - 'repos.txt'
      - '.github/workflows/distribute-secrets.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Distribute secrets to repositories
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          # Fetch secrets from organization secrets
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "Distributing secrets to repositories listed in repos.txt"
          echo "================================================"
          
          # Read repos from repos.txt
          while IFS= read -r repo || [ -n "$repo" ]; do
            # Skip empty lines and comments
            [[ -z "$repo" || "$repo" =~ ^#.* ]] && continue
            
            echo ""
            echo "Processing repository: $repo"
            
            # Add DOCKERHUB_USERNAME secret to repository
            echo "  Adding DOCKERHUB_USERNAME..."
            if gh secret set DOCKERHUB_USERNAME \
              --repo "$repo" \
              --body "$DOCKERHUB_USERNAME"; then
              echo "  ✓ DOCKERHUB_USERNAME added"
            else
              echo "  ✗ Failed to add DOCKERHUB_USERNAME"
            fi
            
            # Add DOCKERHUB_PASSWORD secret to repository
            echo "  Adding DOCKERHUB_PASSWORD..."
            if gh secret set DOCKERHUB_PASSWORD \
              --repo "$repo" \
              --body "$DOCKERHUB_PASSWORD"; then
              echo "  ✓ DOCKERHUB_PASSWORD added"
            else
              echo "  ✗ Failed to add DOCKERHUB_PASSWORD"
            fi
            
            echo "  ✓ Completed $repo"
          done < repos.txt
          
          echo ""
          echo "================================================"
          echo "✓ Secret distribution completed!"
