name: Distribute Secrets to Organization

on:
  workflow_dispatch:  # Manual trigger

jobs:
  distribute-org-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Add secrets to organization
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          ORG_NAME: ${{ secrets.ORG_NAME }}
        run: |
          echo "Adding secrets to organization: $ORG_NAME"
          
          # Add DOCKERHUB_USERNAME secret to organization
          echo "Adding DOCKERHUB_USERNAME to organization..."
          gh secret set DOCKERHUB_USERNAME \
            --org "$ORG_NAME" \
            --visibility all \
            --body "$DOCKERHUB_USERNAME" || echo "Failed to add DOCKERHUB_USERNAME"
          
          # Add DOCKERHUB_PASSWORD secret to organization
          echo "Adding DOCKERHUB_PASSWORD to organization..."
          gh secret set DOCKERHUB_PASSWORD \
            --org "$ORG_NAME" \
            --visibility all \
            --body "$DOCKERHUB_PASSWORD" || echo "Failed to add DOCKERHUB_PASSWORD"
          
          echo "✓ Organization secrets added successfully!"
