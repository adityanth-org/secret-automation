name: Distribute Secrets to Repositories

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'repos.txt'  # Trigger when repo list changes

jobs:
  distribute-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.ORG_ADMIN_TOKEN }}" | gh auth login --with-token

      - name: Distribute secrets to repositories
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          # Read repos from file
          while IFS= read -r repo || [ -n "$repo" ]; do
            # Skip empty lines and comments
            [[ -z "$repo" || "$repo" =~ ^#.*$ ]] && continue
            
            echo "Processing repository: $repo"
            
            # Add DOCKERHUB_USERNAME secret
            echo "Adding DOCKERHUB_USERNAME to $repo..."
            gh secret set DOCKERHUB_USERNAME \
              --repo "$repo" \
              --body "$DOCKERHUB_USERNAME" || echo "Failed to add DOCKERHUB_USERNAME to $repo"
            
            # Add DOCKERHUB_PASSWORD secret
            echo "Adding DOCKERHUB_PASSWORD to $repo..."
            gh secret set DOCKERHUB_PASSWORD \
              --repo "$repo" \
              --body "$DOCKERHUB_PASSWORD" || echo "Failed to add DOCKERHUB_PASSWORD to $repo"
            
            echo "✓ Completed $repo"
            echo "---"
          done < repos.txt
          
          echo "All secrets distributed successfully!"
